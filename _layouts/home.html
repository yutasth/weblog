---
layout: default
---
<section class="entries" aria-label="記事一覧">
  {% assign diary_entries = site.diary | reverse %}
  {% for post in diary_entries limit: 7 %}
    <article class="entry">
      <header class="entry-header">
        <h2><a href="{{ post.url | relative_url }}">{% include post-title.html post=post %}</a></h2>
      </header>
      <div class="entry-body">
        {{ post.content }}
      </div>
    </article>
  {% endfor %}
</section>
